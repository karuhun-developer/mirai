name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push beruntun ke branch yang sama membatalkan run sebelumnya — hasil commit
# lama tidak berguna dan cuma mengantre di runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: CI gagal kalau lockfile tidak sinkron dengan
      # package.json, bukan diam-diam menyelesaikan versi yang berbeda.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
